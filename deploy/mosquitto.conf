# ============================================================
# Mosquitto MQTT Broker - Lab Monitoring System
# Lokasi di VPS: /etc/mosquitto/conf.d/lab-monitoring.conf
#
# Dua listener:
#   1883 : MQTT TCP biasa -> dipakai BACKEND (main.js)
#   9001 : MQTT over WebSockets -> dipakai AGENT (agent.py)
#          (Nginx yang meneruskan WSS :443 /mqtt -> 127.0.0.1:9001)
#
# Kedua listener di-bind ke 127.0.0.1 (localhost) saja karena
# hanya diakses internal VPS. Akses dari luar lewat Cloudflare+Nginx.
# ============================================================

# ---------- Listener lokal untuk backend (TCP biasa) ----------
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true

# ---------- Listener WebSocket untuk agent ----------
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true

# ---------- Logging ----------
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# ---------- Persistence ----------
persistence true
persistence_location /var/lib/mosquitto/

# ---------- Batasan (opsional, aman untuk lab kecil) ----------
max_connections 500
max_queued_messages 1000
message_size_limit 0

# ============================================================
# CATATAN KEAMANAN (disarankan untuk produksi):
#   Ganti allow_anonymous true dengan user/password:
#     1) sudo mosquitto_passwd -c /etc/mosquitto/passwd labuser
#     2) Hapus "allow_anonymous true" di atas
#     3) Tambahkan: password_file /etc/mosquitto/passwd
#     4) Tambahkan username/password di agent.py & backend
# ============================================================
