# ============================================================
# Nginx Reverse Proxy - Lab Monitoring System
# Lokasi di VPS: /etc/nginx/sites-available/ikyypantau
#
# Server block ini melayani DUA hal sekaligus:
#   1) Dashboard  : https://ikyypantau.my.id        -> 127.0.0.1:8800
#   2) MQTT WebSoc: wss://ws-mqtt.ikyypantau.my.id/mqtt -> 127.0.0.1:9001
#
# Aktifkan dengan:
#   sudo ln -s /etc/nginx/sites-available/ikyypantau /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ---------- Dashboard ----------
server {
    listen 443 ssl http2;
    server_name ikyypantau.my.id;

    # Ganti DUA baris ini sesuai lokasi sertifikat Anda
    # (lihat langkah 7 di DEPLOY_VPS.md - Cloudflare Origin Cert ATAU Let's Encrypt)
    ssl_certificate     /etc/ssl/cloudflare/ikyypantau.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ikyypantau.key;

    # Ukuran body untuk request API (aman untuk JSON kecil)
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (untuk /ws dashboard)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Agar session / websocket tidak putus cepat
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------- WebSocket MQTT untuk agent ----------
server {
    listen 443 ssl http2;
    server_name ws-mqtt.ikyypantau.my.id;

    ssl_certificate     /etc/ssl/cloudflare/ikyypantau.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ikyypantau.key;

    # Path /mqtt -> Mosquitto WebSocket listener
    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WAJIB: header upgrade untuk WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Koneksi MQTT itu long-lived -> timeout harus besar
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}

# ---------- Redirect HTTP -> HTTPS ----------
server {
    listen 80;
    server_name ikyypantau.my.id ws-mqtt.ikyypantau.my.id;
    return 301 https://$host$request_uri;
}
